# =============================================================================
# spark-defaults.conf - shared by EVERY Spark process in the sandbox.
#
# This one file is mounted at /opt/spark/conf/spark-defaults.conf in the Spark
# master/workers AND in the Airflow containers (where spark-submit launches the
# driver). Keeping catalog settings in one place means `spark-sql` run by hand
# sees exactly the same tables as the Airflow-launched jobs.
#
# Settings here are only defaults: --conf flags (which SparkSubmitOperator
# generates from its `conf=` argument) override them.
#
# Credentials are NOT in this file. Iceberg's S3FileIO uses the AWS SDK's
# default credential chain, which reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# / AWS_REGION from the environment; docker-compose.yml sets those from .env on
# every container that runs a driver or an executor.
# =============================================================================

# --- Cluster ------------------------------------------------------------------
spark.master                                   spark://spark-master:7077

# --- Jars on driver AND executors ---------------------------------------------
# Both images ship the Iceberg runtime, Iceberg AWS bundle and Postgres JDBC
# driver in /opt/spark-extra-jars. extraClassPath prepends them to the JVM
# classpath when the driver JVM / each executor JVM starts. Because the files
# already exist on every node, nothing has to be shipped at runtime.
# (Alternative: spark.jars.packages=<maven coords> makes the driver download
# them from Maven at startup and serve them to executors. Convenient, but every
# job then depends on Maven Central being reachable.)
spark.driver.extraClassPath                    /opt/spark-extra-jars/*
spark.executor.extraClassPath                  /opt/spark-extra-jars/*

# --- Iceberg ------------------------------------------------------------------
# The SQL extensions add Iceberg-specific SQL: MERGE INTO, CALL <procedures>,
# ALTER TABLE ... WRITE ORDERED BY, etc.
spark.sql.extensions                           org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# A catalog named `lake`, backed by the Iceberg REST catalog service. The REST
# catalog stores "table name -> current metadata file" pointers; the data and
# metadata files themselves live in object storage (RustFS).
spark.sql.catalog.lake                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                    rest
spark.sql.catalog.lake.uri                     http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse               s3://warehouse/
# Read/write files with Iceberg's native S3 client instead of Hadoop s3a.
spark.sql.catalog.lake.io-impl                 org.apache.iceberg.aws.s3.S3FileIO
# RustFS is S3-compatible but is not AWS:
#  * endpoint          - send S3 calls to RustFS instead of *.amazonaws.com
#  * path-style-access - use http://rustfs:9000/warehouse/key instead of the
#                        AWS default virtual-host style http://warehouse.rustfs:9000/key,
#                        which would need wildcard DNS that Docker doesn't provide.
spark.sql.catalog.lake.s3.endpoint             http://rustfs:9000
spark.sql.catalog.lake.s3.path-style-access    true
# Let `SELECT * FROM sales.orders` work without the `lake.` prefix.
spark.sql.defaultCatalog                       lake

# --- SQL behaviour ------------------------------------------------------------
# Interpret/display timestamps in UTC everywhere (driver, executors, JDBC).
spark.sql.session.timeZone                     UTC
# The default of 200 shuffle partitions is sized for big clusters. With 4 cores
# and ~100k rows, 8 is plenty; Adaptive Query Execution (on by default) will
# coalesce them further when they turn out small.
spark.sql.shuffle.partitions                   8

# --- Resources (laptop-sized) -------------------------------------------------
# Each worker offers 2 cores / 2 GB (see SPARK_WORKER_* in .env). With 1 core
# and 1 GB per executor we get up to 4 single-core executors: 2 per worker.
spark.driver.memory                            1g
spark.executor.memory                          1g
spark.executor.cores                           1
# Standalone mode gives an application ALL free cores unless capped. 4 is the
# whole sandbox cluster; lower it (e.g. to 2) if you want two Spark apps to run
# side by side. Airflow serializes our jobs with a pool, so one app at a time.
spark.cores.max                                4

# Quieter Airflow task logs (no ASCII progress bars).
spark.ui.showConsoleProgress                   false
